[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A general-purpose coding agent supporting Claude, OpenAI, DeepSeek, Groq and Ollama"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "langfuse>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "PyGithub>=2.3.0",
    "gitpython>=3.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.15.0,<1.16",
    "import-linter>=2.3,<3.0",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
rag = [
    "fastembed>=0.3.0",
]
full = [
    "tiktoken>=0.7.0",
    "fastembed>=0.3.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-typescript>=0.22.0",
    "tree-sitter-go>=0.22.0",
    "tree-sitter-rust>=0.22.0",
    "tree-sitter-java>=0.22.0",
    "ddgs>=6.0.0",
    "readability-lxml>=0.8.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
agent = "entry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*", "llm*", "tools*", "context*", "entry*", "config*",
    "observability*", "server*", "app*",
    # CC-Native architecture (G1)
    "application*", "runtime_core*", "hook_core*", "eventing*",
    "listeners*", "infrastructure*", "composition*", "core*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short -q -m \"not e2e\""
filterwarnings = [
    "ignore::requests.RequestsDependencyWarning",
    "ignore::requests.exceptions.RequestsDependencyWarning",
]
asyncio_mode = "auto"
markers = [
    "core: Core agent loop, task model, event log",
    "llm: LLM backends, routing, native tool use",
    "tools: Tool implementations (file, shell, git, memory)",
    "context: Token budget, history, compaction, repo map",
    "multi: Multi-agent coordination, DAG, plan",
    "entry: CLI, chat session, renderer, config",
    "e2e: End-to-end behavioral tests with real LLM calls",
    "asyncio: Async WebSocket/integration tests",
]

[tool.coverage.run]
source = ["agent", "llm", "tools", "context", "entry"]
omit = ["tests/*"]

# ── G1: mypy strict configuration ──────────────────────────────────────
[tool.mypy]
strict = true
explicit_package_bases = true
ignore_missing_imports = true
# Core CC-Native directories — errors must trend to zero by G14/G20/G28/G44
# G14 (Hook) → 0 errors, G20 (Runtime) → 0 errors, G28 (Composition) → 0 errors
# G44 (Final) → 0 errors across all core directories
packages = [
    "application",
    "runtime_core",
    "hook_core",
    "eventing",
    "listeners",
    "infrastructure",
    "composition",
    "core",
]

# ── G1: import-linter configuration ────────────────────────────────────
[tool.importlinter]
root_package = "grace_code"
# Contract types:
#   forbidden — A must not import B
#   layers    — higher layers may import lower, not vice versa
[[tool.importlinter.contracts]]
id = "runtime_does_not_import_server"
name = "runtime_does_not_import_server"
type = "forbidden"
description = "Runtime Core must not import Server/Listener/Repository modules"
source_packages = ["runtime_core"]
forbidden_modules = [
    "server",
    "sqlite3",
    "infrastructure.sqlite",
]

[[tool.importlinter.contracts]]
id = "eventing_does_not_import_business"
name = "eventing_does_not_import_business"
type = "forbidden"
description = "EventBus must not import business event schemas"
source_packages = ["eventing"]
forbidden_modules = [
    "application.events",
    "application.coordinators",
]
