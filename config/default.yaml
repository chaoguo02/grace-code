llm:
  provider: ${FORGE_LLM_PROVIDER}
  model: ${FORGE_LLM_MODEL}
  api_key: ${DEEPSEEK_API_KEY}
  base_url: ${FORGE_LLM_BASE_URL}
  max_tokens: 8192
  timeout_seconds: 60

agent:
  max_steps: 40
  budget_tokens: 160000
  log_dir: "" # empty = isolated per-project runtime state

tools:
  shell:
    timeout: 30 # 秒
    max_output_tokens: 8000 # 截断长度
  file:
    max_view_lines: 100 # view 命令每次显示行数
  web:
    search_max_results: 10 # 每次搜索最多返回条数
    fetch_max_chars: 100000 # 抓取最大字符数（~100KB）
    fetch_timeout: 15 # 抓取超时秒数

memory:
  enabled: true # 是否启用长期记忆
  directory: "" # 记忆目录，空=默认 ~/.grace/projects/<hash>/memory/
  max_index_lines: 50 # MEMORY.md 每次注入上下文的最大行数
  auto_memory: true # 是否允许 agent 自主写入记忆

# ── 统一资源治理 ──
# 所有资源先申请后执行，finally 释放。
# mode: observe(只记录不阻止) | soft_enforce(警告但放行) | enforce(阻止超限)
resource_governance:
  mode: enforce

  worker:
    global_max: 2        # 全服务并发 subagent worker 上限
    per_root_max: 2      # 单 root session 并发 worker 上限

  queue:
    max_size: 64          # 全局排队队列容量
    timeout_seconds: 120.0  # 单队列项最大等待秒数

  provider:
    rate_limit_enabled: false  # Phase 3 生效
    rpm: 0                     # 每分钟最大请求数 (0=不限)
    tpm: 0                     # 每分钟最大 token 数 (0=不限)
    max_concurrent: 0          # 单 provider 最大并发请求数 (0=不限)

  event:
    queue_max_size: 4096       # 每个 session 的 WebSocket 事件队列上限

  tool:
    global_max: 8              # 全局并发 MCP 工具调用上限
    per_root_max: 4            # 单个 root session 的 MCP 并发上限

  worktree:
    global_max: 10            # 全局最大 worktree 数
    per_root_max: 3           # 单 root session 最大 worktree 数
    disk_limit_mb: 0          # worktree 磁盘上限 MB (0=不检查)

  shutdown:
    drain_timeout_seconds: 30.0
    force_kill_seconds: 5.0

observability:
  enabled: false
  provider: langfuse
  environment: ${LANGFUSE_ENVIRONMENT}
  flush_on_exit: true
  capture_prompts: true
  capture_tool_outputs: true
  capture_llm_outputs: true
  mask_sensitive_data: true
  sample_rate: 1.0
  langfuse:
    public_key: ${LANGFUSE_PUBLIC_KEY}
    secret_key: ${LANGFUSE_SECRET_KEY}
    base_url: ${LANGFUSE_BASE_URL}

prompts:
  source: ${FORGE_PROMPT_SOURCE}
  label: ${LANGFUSE_PROMPT_LABEL}
  version: ${LANGFUSE_PROMPT_VERSION}
  namespace: ${LANGFUSE_PROMPT_NAMESPACE}
  cache_ttl_seconds: 300
  langfuse:
    public_key: ${LANGFUSE_PUBLIC_KEY}
    secret_key: ${LANGFUSE_SECRET_KEY}
    base_url: ${LANGFUSE_BASE_URL}

context:
  repo_map_budget: 8000 # repo-map 最大 token 数
  history_window: 20 # 保留最近 N 轮对话
  request_budget_tokens: 110000 # 单次 LLM request 输入上下文目标 (85% of 128K)
  session_compact_tokens: 50000 # shared_history 超过此值触发自动压缩
  auto_compact_after_round: true # 每轮结束后检查是否需要自动压缩
  compact_every_rounds: 3 # 每 N 轮强制检查压缩
  artifact_threshold_tokens: 2000 # 工具输出超过此值时 artifact 化（Phase 4）
  artifact_storage_dir: "" # empty = isolated per-project runtime state

# ---------------------------------------------------------------------------
# MCP Servers — 外部 MCP 工具服务器
# ---------------------------------------------------------------------------
# 每个 server 是一个独立进程，通过 stdio JSON-RPC 通信。
# forge-agent 启动时自动连接每个 server，发现其工具并注册到工具表。
#
# 格式：
# mcp_servers:
#   <server_name>:
#     command: <启动命令>
#     args: [<参数列表>]
#     env:       # 可选，额外环境变量
#       KEY: value
#     cwd: ""    # 可选，工作目录
#
# 示例（内置 web-search MCP server）：
# mcp_servers:
#   web-search:
#     command: python
#     args: ["-m", "mcp_servers.web_search_server"]
#     env:
#       SEARCH_MAX_RESULTS: "10"
#       FETCH_MAX_CHARS: "100000"
#       FETCH_TIMEOUT: "15"
#
# 第三方 MCP server（如 Brave Search）：
#   brave-search:
#     command: npx
#     args: ["-y", "@anthropic/mcp-server-brave-search"]
#     env:
#       BRAVE_API_KEY: "${BRAVE_API_KEY}"
mcp_servers:
  weather-mock:
    transport: stdio
    command: python
    args: ["-m", "examples.mcp_servers.weather_mock_server"]
    cwd: "."
    timeout_seconds: 15
